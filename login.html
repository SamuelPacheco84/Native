<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nativa - Iniciar Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --verde-bosque: #285943;
      --verde-natural: #6F9E73;
      --beige: #F3EBDD;
      --terracota: #C97852;
      --blanco: #FFFFFF;
      --gris-texto: #64748b;
      --gris-claro: #f1f5f9;
      --border-color: #cbd5e1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      background-color: var(--beige);
      overflow-x: hidden;
    }
    .page-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    /* Background decorations */
    .bg-decor {
      position: absolute;
      z-index: 0;
      pointer-events: none;
    }
    .bg-top-left { top: -80px; left: -80px; width: 400px; transform: rotate(-120deg) scaleX(-1); }
    .bg-top-right { top: 0; right: 0; width: 215px; }
    .bg-bottom-left { bottom: 0; left: 0; width: 265px; z-index: 1; }
    .bg-center-left { bottom: 0; left: 0; width: 464px; opacity: 0.8; z-index: 0; }
    .bg-top-right-5 { top: 0; right: 0; width: 480px; }
    .bg-bottom-right-1 { bottom: -60px; right: -80px; width: 380px; transform: rotate(15deg); }

    .auth-container {
      display: flex;
      width: 100%;
      max-width: 1000px;
      z-index: 2;
      align-items: center;
      gap: 40px;
    }

    /* Left Panel */
    .auth-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .auth-logo {
      width: 280px;
      margin-bottom: 24px;
    }
    .round-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
    }
    .auth-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--verde-bosque);
      margin-bottom: 12px;
      line-height: 1.2;
    }
    .auth-subtitle {
      font-family: 'Lora', serif;
      font-size: 16px;
      color: var(--gris-texto);
      max-width: 320px;
      margin-bottom: 40px;
      line-height: 1.5;
    }
    .auth-features {
      display: flex;
      gap: 30px;
      background: rgba(255,255,255,0.3);
      padding: 20px 30px;
      border-radius: 16px;
    }
    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .feature-icon {
      width: 45px;
      height: 45px;
      background-color: rgba(111, 158, 115, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--verde-bosque);
    }
    .feature-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--verde-bosque);
      line-height: 1.3;
    }

    /* Right Panel (Card) */
    .auth-right {
      flex: 1;
      display: flex;
      justify-content: center;
    }
    .auth-card {
      background: var(--blanco);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 40px rgba(40, 89, 67, 0.08);
      position: relative;
    }
    .card-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      display: block;
    }
    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--verde-bosque);
      text-align: center;
      margin-bottom: 8px;
    }
    .card-subtitle {
      font-family: 'Lora', serif;
      font-size: 14px;
      color: var(--gris-texto);
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 6px;
      margin-left: 2px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i.left-icon {
      position: absolute;
      left: 16px;
      color: #94a3b8;
      font-size: 14px;
    }
    .input-wrapper input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1e293b;
      transition: all 0.3s;
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: var(--verde-natural);
      box-shadow: 0 0 0 3px rgba(111, 158, 115, 0.15);
    }
    .input-wrapper i.right-icon {
      position: absolute;
      right: 16px;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
    }
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--gris-texto);
    }
    .checkbox-wrap input {
      accent-color: var(--verde-bosque);
      width: 16px; height: 16px;
      cursor: pointer;
    }
    .forgot-link {
      font-size: 13px;
      color: var(--verde-bosque);
      font-weight: 600;
      text-decoration: none;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--verde-bosque);
      color: var(--blanco);
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-submit:hover {
      background-color: #1e4533;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      color: #94a3b8;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider:not(:empty)::before {
      margin-right: .5em;
    }
    .divider:not(:empty)::after {
      margin-left: .5em;
    }
    .social-btns {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .btn-social {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--blanco);
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-social:hover {
      background: var(--gris-claro);
    }
    .btn-social img {
      width: 18px;
    }
    .btn-social i {
      font-size: 18px;
      color: #1877F2; /* Facebook blue */
    }
    .auth-footer {
      text-align: center;
      font-size: 13px;
      color: var(--gris-texto);
    }
    .auth-footer a {
      color: var(--terracota);
      font-weight: 600;
      text-decoration: none;
    }
    @media (max-width: 900px) {
      .auth-container {
        flex-direction: column;
        gap: 30px;
      }
      .bg-decor { display: none; 
      margin-top: -20px;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Background Decor Images -->
    <img src="img_login/2.png" class="bg-decor bg-top-left" alt="">
    <img src="img_login/1.png" class="bg-decor bg-bottom-right-1" alt="">
    <img src="img_login/4.png" class="bg-decor bg-center-left" alt="">
    <img src="img_login/3.png" class="bg-decor bg-bottom-left" alt="">
    <img src="img_login/5.png" class="bg-decor bg-top-right-5" alt="">

    <div class="auth-container">
      <div class="auth-left">
        <img src="img/logo.png" alt="Nativa" class="auth-logo">
        <img src="img_login/6.png" alt="Icono" class="round-icon">
        <h1 class="auth-title">Bienestar que se<br>siente natural</h1>
        <p class="auth-subtitle">Inicia sesión y descubre una selección de productos naturales para tu día a día</p>
        
        <div class="auth-features">
          <div class="feature-item">
            <div class="feature-icon"><i class="fas fa-seedling"></i></div>
            <span class="feature-text">Ingredientes<br>naturales</span>
          </div>
          <div class="feature-item">
            <div class="feature-icon"><i class="fas fa-bolt"></i></div>
            <span class="feature-text">Energía<br>natural</span>
          </div>
          <div class="feature-item">
            <div class="feature-icon"><i class="far fa-heart"></i></div>
            <span class="feature-text">Bienestar<br>integral</span>
          </div>
        </div>
      </div>

      <div class="auth-right">
        <div class="auth-card">
          <img src="img_login/6.png" alt="Icono" class="card-icon">
          <h2 class="card-title">Iniciar Sesión</h2>
          <p class="card-subtitle">Accede a tu cuenta para continuar</p>

          <form onsubmit="handleAuthSubmit(event)">
            <div class="form-group">
              <label class="form-label">Correo electrónico</label>
              <div class="input-wrapper">
                <i class="far fa-envelope left-icon"></i>
                <input type="email" placeholder="ejemplo@correo.com" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Contraseña</label>
              <div class="input-wrapper">
                <i class="fas fa-lock left-icon"></i>
                <input type="password" id="login-password" placeholder="Ingresa tu contraseña" required>
                <i class="far fa-eye right-icon" onclick="togglePassword('login-password')"></i>
              </div>
            </div>
            
            <div class="form-options">
              <label class="checkbox-wrap">
                <input type="checkbox"> Recordarme
              </label>
              <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>

            <div class="divider">o continua con</div>

            <div class="social-btns">
              <!-- SVG Google Icon -->
              <button type="button" class="btn-social">
                <svg width="18" height="18" viewBox="0 0 48 48">
                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Google
              </button>
              <button type="button" class="btn-social">
                <i class="fab fa-facebook"></i> Facebook
              </button>
            </div>

            <div class="auth-footer">
              ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      const icon = input.nextElementSibling;
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      let emailInput = null;
      let nameInput = null;
      let lastnameInput = null;
      
      const inputs = e.target.querySelectorAll('input');
      inputs.forEach(input => {
        if(input.type === 'email') emailInput = input.value;
        if(input.placeholder.toLowerCase().includes('nombre')) nameInput = input.value;
        if(input.placeholder.toLowerCase().includes('apellido')) lastnameInput = input.value;
      });
      
      if(emailInput) {
        localStorage.setItem('nativa_user_email', emailInput);
      }
      if(nameInput) {
        localStorage.setItem('nativa_user_name', nameInput);
      }
      if(lastnameInput) {
        localStorage.setItem('nativa_user_lastname', lastnameInput);
      }
      
      window.location.href = 'perfil.html';
    }
  </script>
</body>
</html>
